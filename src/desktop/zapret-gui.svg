<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24273A"/>
      <stop offset="100%" stop-color="#181926"/>
    </linearGradient>

    <!-- Vibrant Accent Gradient (YouTube Red to Discord Blurple) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="50%" stop-color="#9A5CF5"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>

    <!-- Glowing Shield Outline Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C72" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Shield Base Path -->
  <path d="M128 44 C164 44 196 56 196 82 C196 142 160 188 128 208 C96 188 60 142 60 82 C60 56 92 44 128 44 Z"
        fill="#1E2030" stroke="url(#borderGrad)" stroke-width="3.5" opacity="0.95"/>

  <!-- Inner Dynamic Zap / Bypass Wave -->
  <!-- Stylized Z / Lightning symbolizing DPI bypass -->
  <path d="M148 68 L88 132 L124 132 L108 188 L168 124 L132 124 Z"
        fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Subtle Network Node dots -->
  <circle cx="80" cy="80" r="5" fill="#FF4757" opacity="0.85"/>
  <circle cx="176" cy="80" r="5" fill="#5865F2" opacity="0.85"/>
  <circle cx="128" cy="196" r="4.5" fill="#A855F7" opacity="0.85"/>
</svg>
