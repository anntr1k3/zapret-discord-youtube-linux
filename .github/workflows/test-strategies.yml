name: Test Strategies & Services

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All offline Python tests (no root, network or host changes)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s ci -p 'test_*.py'

  #######################################################################
  # Strategy tests (native Ubuntu)
  #######################################################################
  test-strategies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables git

      - name: Download dependencies
        run: ./service.sh download-deps --default

      - name: List available strategies
        run: ./service.sh strategy list

      - name: Run strategy tests
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: sudo ./ci/test_strategies.sh

  #######################################################################
  # Service tests (real init systems)
  #######################################################################
  test-service:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - init: systemd
            type: native

    steps:
      - uses: actions/checkout@v4

      ###################################################################
      # Native systemd
      ###################################################################
      - name: Install dependencies (native)
        if: matrix.type == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables git

      - name: Run tests (native)
        run: |
          sudo install -d -m 0755 -o root -g root /opt/zapret-ci
          sudo cp -a "$GITHUB_WORKSPACE/." /opt/zapret-ci/
          sudo chown -R root:root /opt/zapret-ci
          sudo chmod -R go-w /opt/zapret-ci
          sudo /opt/zapret-ci/ci/test_service.sh
