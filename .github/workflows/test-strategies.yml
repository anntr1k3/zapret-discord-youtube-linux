name: Test Strategies & Services

on:
  push:
    branches: [master, 'ci/rc-1.0.1']
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline Python tests
        run: python3 -m unittest discover -s ci -p 'test_*.py'

  test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build a candidate with pinned upstream inputs
        shell: bash
        run: |
          scripts/build-deb.sh --output "$RUNNER_TEMP/zapret-package"
          packages=("$RUNNER_TEMP"/zapret-package/*.deb)
          test "${#packages[@]}" -eq 1 && test -f "${packages[0]}"
          echo "ZAPRET_TEST_DEB=${packages[0]}" >> "$GITHUB_ENV"
      - name: Inspect archive and dry-run all packaged profiles
        run: |
          python3 -m unittest ci.test_deb
          python3 ci/check_deb_runtime.py "$ZAPRET_TEST_DEB"
      - name: Mark and check GitHub-hosted disposable VM
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          systemd-detect-virt --vm
          sudo hostnamectl set-hostname zapret-integration
          # Keep sudo hostname lookups local after renaming the guest.
          printf '127.0.1.1 zapret-integration\n' | sudo tee -a /etc/hosts
          sudo install -o root -g root -m 0644 /dev/null /var/tmp/zapret-vm-provisioned
          # Hosted images may leave /opt writable for tool provisioning. The
          # production installer must reject such a parent, not adopt it.
          test -d /opt && test ! -L /opt
          stat -c 'Before: %U:%G %a %n' /opt
          sudo chown root:root /opt
          sudo chmod go-w /opt
          stat -c 'After: %U:%G %a %n' /opt
      - name: Package lifecycle and tester through real systemd and nftables
        run: |
          sudo apt-get update
          sudo python3 ci/vm_deb_smoke.py "$ZAPRET_TEST_DEB" --tester --acknowledge-disposable-vm
      - name: GTK demo smoke from the installed application (no root)
        run: |
          sudo apt-get install -y xvfb xauth
          xvfb-run --auto-servernum /usr/bin/zapret-gui --demo --tester --smoke-test
